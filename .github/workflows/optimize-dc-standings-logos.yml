name: Optimize DC standings logos

on:
  push:
    branches:
      - test/aug21-schedule-update
    paths:
      - .github/workflows/optimize-dc-standings-logos.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: test/aug21-schedule-update

      - name: Install SVG rasterizer and PNG optimizer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin pngquant

      - name: Build lightweight standings PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/mascots/standings

          logos=(
            anacostia
            ballou
            bell
            cardozo
            coolidge
            dunbar
            eastern
            hd-woodson
            jackson-reed
            mckinley-tech
            phelps-ace
            ron-brown
            roosevelt
            archbishop-carroll
            bishop-mcnamara
            dematha
            gonzaga
            good-counsel
            digital-pioneers-academy
            kipp-college-prep
            kipp-dc-legacy
            sidwell-friends
            st-johns
          )

          for name in "${logos[@]}"; do
            src="public/mascots/${name}.svg"
            out="public/mascots/standings/${name}.png"

            if [[ ! -f "$src" ]]; then
              echo "Skipping missing $src"
              continue
            fi

            rsvg-convert --keep-aspect-ratio --width 128 --height 128 "$src" -o "$out"
            pngquant --force --skip-if-larger --quality=70-90 --speed 1 --output "${out}.tmp" -- "$out" || true

            if [[ -f "${out}.tmp" ]]; then
              mv "${out}.tmp" "$out"
            fi

            echo "$(basename "$src"): $(wc -c < "$src") bytes -> $(wc -c < "$out") bytes"
          done

      - name: Commit optimized standings assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mascots/standings

          if git diff --cached --quiet; then
            echo "No optimized assets changed."
            exit 0
          fi

          git commit -m "Add lightweight DC standings logo assets"
          git push origin HEAD:test/aug21-schedule-update
