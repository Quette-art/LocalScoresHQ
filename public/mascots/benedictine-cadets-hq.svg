<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Benedictine Cadets crest">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a8a52"/>
      <stop offset="0.45" stop-color="#076b43"/>
      <stop offset="1" stop-color="#033826"/>
    </linearGradient>
    <linearGradient id="gDarkGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#087149"/>
      <stop offset="1" stop-color="#022d20"/>
    </linearGradient>
    <linearGradient id="gSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#f1f3f2"/>
      <stop offset="0.65" stop-color="#bdc4c1"/>
      <stop offset="1" stop-color="#727a76"/>
    </linearGradient>
    <linearGradient id="gBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c211f"/>
      <stop offset="0.55" stop-color="#060807"/>
      <stop offset="1" stop-color="#171b19"/>
    </linearGradient>
  </defs>

  <!-- layered athletic shield -->
  <path d="M256 47 421 105l23 200c3 76-52 137-188 199C120 442 65 381 68 305l23-200Z"
        fill="#06100c" stroke="#0a5839" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 60 409 114l21 185c2 68-47 122-174 181-127-59-176-113-174-181l21-185Z"
        fill="url(#gSilver)" stroke="#050807" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 72 396 122l19 173c2 59-42 107-159 162-117-55-161-103-159-162l19-173Z"
        fill="url(#gBlack)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 84 383 130l17 161c1 51-37 94-144 145-107-51-145-94-144-145l17-161Z"
        fill="url(#gGreen)" stroke="#055f3c" stroke-width="5" stroke-linejoin="round"/>

  <!-- horizontal military stripes -->
  <path d="M113 173h286M109 191h294" stroke="#ffffff" stroke-width="8"/>
  <path d="M113 180h286" stroke="#101513" stroke-width="5"/>

  <!-- military cap -->
  <path d="M163 71c31-44 155-45 186 0 10 14 4 28-14 40-39 26-119 27-158 1-19-12-24-27-14-41Z"
        fill="url(#gGreen)" stroke="#050807" stroke-width="9"/>
  <path d="M180 105c36 12 116 12 152 0l-15 25c-35 17-87 17-122 0Z"
        fill="url(#gBlack)" stroke="#050807" stroke-width="7"/>
  <path d="M190 109c34 8 98 8 132 0" fill="none" stroke="url(#gSilver)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="188" cy="109" r="8" fill="url(#gSilver)" stroke="#050807" stroke-width="3"/>
  <circle cx="324" cy="109" r="8" fill="url(#gSilver)" stroke="#050807" stroke-width="3"/>

  <!-- cap cross and tiny laurel -->
  <path d="M256 67v28M245 76h22" stroke="#050807" stroke-width="8" stroke-linecap="square"/>
  <path d="M256 67v28M245 76h22" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>
  <path d="M239 91c-10-7-15-15-16-25M273 91c10-7 15-15 16-25" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- stars -->
  <path d="m139 153 8 17 19 2-14 12 4 19-17-10-17 10 4-19-14-12 19-2Z"
        fill="url(#gSilver)" stroke="#050807" stroke-width="5"/>
  <path d="m373 153 8 17 19 2-14 12 4 19-17-10-17 10 4-19-14-12 19-2Z"
        fill="url(#gSilver)" stroke="#050807" stroke-width="5"/>

  <!-- full silver laurels -->
  <g fill="url(#gSilver)" stroke="#050807" stroke-width="3">
    <path d="M154 326c-24-24-37-55-37-91 16 17 26 35 28 54 5-19 14-36 27-51 4 21 1 40-10 57 13-11 27-18 42-21-3 19-13 35-29 46 14-5 27-6 40-3-10 16-25 25-43 28Z"/>
    <path d="M358 326c24-24 37-55 37-91-16 17-26 35-28 54-5-19-14-36-27-51-4 21-1 40 10 57-13-11-27-18-42-21 3 19 13 35 29 46-14-5-27-6-40-3 10 16 25 25 43 28Z"/>
  </g>

  <!-- oversized beveled B -->
  <text x="256" y="320" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="211" font-weight="900"
        fill="#050807" stroke="#050807" stroke-width="30" stroke-linejoin="round">B</text>
  <text x="256" y="320" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="211" font-weight="900"
        fill="url(#gGreen)" stroke="#ffffff" stroke-width="20" stroke-linejoin="round">B</text>
  <text x="256" y="320" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="211" font-weight="900"
        fill="url(#gGreen)" stroke="#050807" stroke-width="7" stroke-linejoin="round">B</text>
  <path d="M205 195h83c31 0 51 13 51 36 0 17-9 29-27 36 23 6 35 20 35 40 0 30-23 47-59 47h-83Z"
        fill="none" stroke="#0c8e57" stroke-width="7" opacity=".45"/>

  <!-- big BENEDICTINE banner -->
  <path d="M35 333c65-22 138-31 221-31s156 9 221 31l-18 55 15 31c-74-18-145-25-218-25s-144 7-218 25l15-31Z"
        fill="#050807" stroke="#050807" stroke-width="12" stroke-linejoin="round"/>
  <path d="M48 340c61-18 131-26 208-26s147 8 208 26l-12 39 9 23c-69-15-136-21-205-21s-136 6-205 21l9-23Z"
        fill="url(#gDarkGreen)" stroke="#0b8b55" stroke-width="5" stroke-linejoin="round"/>
  <text x="256" y="371" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="51" font-weight="900"
        letter-spacing="-1" fill="#050807" stroke="#050807" stroke-width="8" paint-order="stroke fill">BENEDICTINE</text>
  <text x="256" y="371" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="51" font-weight="900"
        letter-spacing="-1" fill="url(#gSilver)" stroke="#ffffff" stroke-width="2" paint-order="stroke fill">BENEDICTINE</text>

  <!-- CADETS ribbon -->
  <path d="M119 387c45 8 91 12 137 12s92-4 137-12l-16 47c-39 9-79 13-121 13s-82-4-121-13Z"
        fill="url(#gSilver)" stroke="#050807" stroke-width="7"/>
  <path d="m149 408 7 5-3 8 8-3 6 6 1-9 9-2-8-5 1-9-7 6-8-4 4 7Zm196 0 7 5-3 8 8-3 6 6 1-9 9-2-8-5 1-9-7 6-8-4 4 7Z"
        fill="#00633e"/>
  <text x="256" y="427" text-anchor="middle"
        font-family="Arial Black,Arial,sans-serif" font-size="30" font-weight="900"
        letter-spacing="7" fill="#075139">CADETS</text>

  <!-- bottom cross -->
  <path d="M256 438v42M239 451h34" stroke="#050807" stroke-width="12" stroke-linecap="square"/>
  <path d="M256 438v42M239 451h34" stroke="#ffffff" stroke-width="5" stroke-linecap="square"/>
</svg>