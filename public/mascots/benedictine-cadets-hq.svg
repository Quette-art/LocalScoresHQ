<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Benedictine Cadets crest</title>
  <desc id="desc">Crisp green and white Benedictine Cadets shield with bold B monogram and banner.</desc>

  <!-- Outer shield -->
  <path d="M256 36 423 112v154c0 107-66 177-167 220C155 443 89 373 89 266V112Z" fill="#ffffff" stroke="#0b1d17" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 58 402 125v139c0 94-56 156-146 196-90-40-146-102-146-196V125Z" fill="#07553d" stroke="#0b1d17" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 80 379 137v123c0 80-46 134-123 171-77-37-123-91-123-171V137Z" fill="#0a6a4b" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>

  <!-- Cadet rank bars -->
  <g fill="#ffffff">
    <rect x="148" y="171" width="72" height="13" rx="6" transform="rotate(-28 184 177.5)"/>
    <rect x="151" y="196" width="72" height="13" rx="6" transform="rotate(-28 187 202.5)"/>
    <rect x="292" y="171" width="72" height="13" rx="6" transform="rotate(28 328 177.5)"/>
    <rect x="289" y="196" width="72" height="13" rx="6" transform="rotate(28 325 202.5)"/>
  </g>

  <!-- Simple cadet cap -->
  <path d="M178 117c26-30 130-30 156 0l-15 37H193Z" fill="#ffffff" stroke="#0b1d17" stroke-width="8" stroke-linejoin="round"/>
  <path d="M194 121c23-18 101-18 124 0l-8 18H202Z" fill="#07553d"/>
  <path d="M209 153h94l-12 16h-70Z" fill="#d5ba67" stroke="#0b1d17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Bold central B -->
  <text x="256" y="337" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="190" fill="#ffffff" stroke="#0b1d17" stroke-width="8" paint-order="stroke fill">B</text>

  <!-- Banner -->
  <path d="M73 341 128 319c36 13 79 19 128 19s92-6 128-19l55 22-27 35 17 33-61-11c-31 13-68 20-112 20s-81-7-112-20l-61 11 17-33Z" fill="#ffffff" stroke="#0b1d17" stroke-width="9" stroke-linejoin="round"/>
  <path d="M99 348 132 335c35 11 76 16 124 16s89-5 124-16l33 13-19 24 8 16-39-7c-31 10-66 15-107 15s-76-5-107-15l-39 7 8-16Z" fill="#07553d"/>
  <text x="256" y="381" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="35" letter-spacing="1" fill="#ffffff">BENEDICTINE</text>

  <!-- Small identity bar -->
  <path d="M170 419c27 7 56 11 86 11s59-4 86-11l-15 31c-22 8-46 12-71 12s-49-4-71-12Z" fill="#ffffff" stroke="#0b1d17" stroke-width="7" stroke-linejoin="round"/>
  <text x="256" y="450" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="5" fill="#07553d">CADETS</text>
</svg>
