<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 700" role="img" aria-label="Benedictine Cadets crest">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#118252"/>
      <stop offset="0.55" stop-color="#05633f"/>
      <stop offset="1" stop-color="#033d29"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d7dcda"/>
      <stop offset="1" stop-color="#a4aaa7"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M310 70 520 150l18 228c3 94-62 176-228 251C144 554 79 472 82 378l18-228Z"
