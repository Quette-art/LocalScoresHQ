        fill="url(#green)" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/>
  <path d="M310 111 482 177l14 190c2 67-48 126-186 191-138-65-188-124-186-191l14-190Z"
        fill="none" stroke="#0a120f" stroke-width="7"/>

  <!-- cadet cap -->
  <path d="M187 91c39-49 207-51 246 0 11 14 6 31-13 44-45 31-175 32-220 1-20-14-25-30-13-45Z"
