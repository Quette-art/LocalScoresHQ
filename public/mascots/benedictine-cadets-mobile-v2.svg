  <!-- bottom cross -->
  <path d="M310 596v49M291 613h38" stroke="#ffffff" stroke-width="13" stroke-linecap="square"/>
  <path d="M310 596v49M291 613h38" stroke="#08130f" stroke-width="4" stroke-linecap="square"/>
