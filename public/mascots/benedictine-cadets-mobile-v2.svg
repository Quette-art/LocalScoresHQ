  <path d="M207 129c38 13 167 13 205 0l-20 30c-45 20-119 20-164 0Z"
        fill="#071712" stroke="#08130f" stroke-width="8"/>
  <path d="M218 130c43 10 141 10 184 0" fill="none" stroke="url(#silver)" stroke-width="11" stroke-linecap="round"/>
