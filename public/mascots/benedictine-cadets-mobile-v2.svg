  <!-- dominant B -->
  <path d="M204 187h139c65 0 101 29 101 79 0 31-15 53-45 66 38 11 58 38 58 77 0 61-42 93-116 93H204V187Zm82 65v61h49c23 0 35-11 35-30 0-20-12-31-35-31h-49Zm0 127v60h56c26 0 40-10 40-30 0-20-14-30-40-30h-56Z"
        fill="#0b6d46" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
  <path d="M204 187h139c65 0 101 29 101 79 0 31-15 53-45 66 38 11 58 38 58 77 0 61-42 93-116 93H204V187Zm82 65v61h49c23 0 35-11 35-30 0-20-12-31-35-31h-49Zm0 127v60h56c26 0 40-10 40-30 0-20-14-30-40-30h-56Z"
        fill="none" stroke="#0a120f" stroke-width="8" stroke-linejoin="round"/>

