  <path d="m462 211 10 22 24 2-18 15 6 24-22-13-22 13 6-24-18-15 24-2Z"
        fill="#ffffff" stroke="#08130f" stroke-width="6"/>

  <!-- simple laurels -->
  <g fill="url(#silver)" stroke="#08130f" stroke-width="4">
    <path d="M177 448c-29-35-39-78-30-121 18 27 27 54 22 80 11-20 25-38 42-55-2 28-13 52-33 71 17-8 34-12 51-12-12 20-29 32-52 37Z"/>
    <path d="M443 448c29-35 39-78 30-121-18 27-27 54-22 80-11-20-25-38-42-55 2 28 13 52 33 71-17-8-34-12-51-12 12 20 29 32 52 37Z"/>
