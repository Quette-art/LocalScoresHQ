<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Benedictine score mark</title>
  <desc id="desc">A bold varsity letter B in gray with white and black outlines for compact score displays.</desc>
  <g transform="translate(128 136)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900"
      fill="#54575b" stroke="#111111" stroke-width="18" stroke-linejoin="round"
      paint-order="stroke fill">B</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900"
      fill="#54575b" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"
      paint-order="stroke fill">B</text>
  </g>
</svg>
