<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="St. Vincent Pallotti SVP compact panther mark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5a38"/><stop offset="1" stop-color="#043d29"/>
    </linearGradient>
  </defs>

  <!-- curved slash/swoosh from the approved compact identity -->
  <path d="M28 154C64 196 153 211 245 203C195 196 135 177 91 148C66 132 46 128 28 154Z" fill="#05080b" stroke="#d9b45a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M37 151C74 181 140 196 206 193C158 184 113 166 80 143C60 130 47 133 37 151Z" fill="#0a5a38" stroke="#f5f5f5" stroke-width="4"/>

  <!-- oversized collegiate SVP -->
  <g font-family="Arial Black,Impact,sans-serif" font-weight="900" font-style="italic" text-anchor="middle" paint-order="stroke fill" stroke-linejoin="miter">
    <text x="145" y="161" font-size="132" letter-spacing="-22" fill="#05080b" stroke="#d9b45a" stroke-width="18">SVP</text>
    <text x="145" y="161" font-size="132" letter-spacing="-22" fill="#f5f5f5" stroke="#05080b" stroke-width="12">SVP</text>
    <text x="145" y="161" font-size="132" letter-spacing="-22" fill="url(#g)" stroke="#f5f5f5" stroke-width="6">SVP</text>
  </g>

  <!-- large panther head attached to the right side -->
  <g transform="translate(220 22)">
    <path d="M20 28C34 8 62 3 81 12L97 3L105 25C124 31 140 46 145 65L157 75L143 89C139 109 124 127 103 135L89 154L72 139C50 140 29 127 19 108L4 98L15 83C9 64 10 44 20 28Z" fill="#05080b" stroke="#d9b45a" stroke-width="8" stroke-linejoin="round"/>
    <path d="M28 31C42 16 64 14 80 20L94 12L97 32C116 38 130 50 135 67L146 76L135 86C131 104 117 118 98 124L85 142L74 128C55 129 37 118 29 102L16 95L24 82C17 64 19 45 28 31Z" fill="#12161b" stroke="#f5f5f5" stroke-width="4"/>

    <!-- ear / brow / cheek plates -->
    <path d="M39 31L62 17L69 45Z" fill="#2e343c"/>
    <path d="M90 24L113 36L91 52Z" fill="#353c45"/>
    <path d="M41 56C58 44 80 44 95 55C77 53 63 60 51 72Z" fill="#3f464f"/>
    <path d="M94 56C111 56 126 63 134 76C119 69 106 70 94 78Z" fill="#4a5159"/>
    <path d="M41 78C56 71 70 73 81 82C67 82 56 88 48 99Z" fill="#2a3036"/>
    <path d="M96 80C112 77 125 82 133 94C119 88 108 92 99 102Z" fill="#343b43"/>

    <!-- eyes -->
    <path d="M59 61L78 58L70 71L57 69Z" fill="#7ee247" stroke="#05080b" stroke-width="3"/>
    <path d="M100 60L119 63L112 73L99 69Z" fill="#7ee247" stroke="#05080b" stroke-width="3"/>
    <circle cx="67" cy="64" r="3" fill="#05080b"/><circle cx="108" cy="66" r="3" fill="#05080b"/>

    <!-- muzzle -->
    <path d="M69 86C82 77 101 79 112 89C119 96 118 106 110 113C100 122 82 123 69 115C58 108 58 95 69 86Z" fill="#e8e8e8" stroke="#05080b" stroke-width="4"/>
    <path d="M78 88C86 83 95 83 103 88L97 97H84Z" fill="#0b6a3d" stroke="#05080b" stroke-width="3"/>
    <path d="M77 101C87 107 98 107 108 101C105 116 82 120 72 108Z" fill="#05080b"/>

    <!-- fangs -->
    <path d="M74 104L82 110L77 121Z" fill="#fff"/><path d="M103 108L110 103L107 120Z" fill="#fff"/>
    <path d="M84 116C90 122 98 122 103 116L101 127H87Z" fill="#0b6a3d"/>

    <!-- whiskers -->
    <path d="M59 94L30 88M60 101L29 103M113 94L143 88M112 101L143 104" stroke="#f5f5f5" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>